name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Tornar gradlew executável
      run: chmod +x ./gradlew || true

    - name: Compilar APK (Debug)
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew :app:assembleDebug --stacktrace --info
        else
          echo "Gradle Wrapper não encontrado. Usando gradle do sistema..."
          gradle :app:assembleDebug --stacktrace --info
        fi

    - name: Disponibilizar APK para download
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
